<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Pith Player">
  <!-- Плитка. Кайма нужна, чтобы знак не растворялся на тёмной странице. -->
  <rect x="2.5" y="2.5" width="251" height="251" rx="54" fill="#111214" stroke="#363D47" stroke-width="5"/>

  <!-- Треугольник «играть» без кончика: синий, как пройденная часть полосы. -->
  <path d="M76.8 51.2 L151 97.6 L151 158.4 L76.8 204.8 Z" fill="#64C8FF"/>

  <!-- Отрезанный кончик: жёлтый, как отрезки на полосе перемотки. -->
  <path d="M167.7 102.4 L208.7 128 L167.7 153.6 Z" fill="#FFCD3C"/>
</svg>
