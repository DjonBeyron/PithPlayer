[package]
name = "pith-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pith-player"
path = "src/main.rs"

[dependencies]
pith-mpv = { path = "../pith-mpv" }
pith-store = { path = "../pith-store" }
pith-subs = { path = "../pith-subs" }
pith-fragments = { path = "../pith-fragments" }
eframe.workspace = true
egui.workspace = true
glow.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15"
# Буфер обмена для копирования реплик субтитров.
arboard = "3"
# Разбор .ico в пиксели: eframe принимает иконку окна только так.
# JPEG — мозаика миниатюр и кадры предпросмотра приходят в нём.
image = { version = "0.25", default-features = false, features = ["ico", "jpeg"] }
# Файловые ассоциации в HKCU: делаются по явному действию пользователя.
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
