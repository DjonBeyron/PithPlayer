[package]
name = "pith-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pith-player"
path = "src/main.rs"

[dependencies]
pith-mpv = { path = "../pith-mpv" }
pith-store = { path = "../pith-store" }
pith-tmdb = { path = "../pith-tmdb" }
pith-notion = { path = "../pith-notion" }
pith-dict = { path = "../pith-dict" }
pith-update = { path = "../pith-update" }
pith-subs = { path = "../pith-subs" }
pith-fragments = { path = "../pith-fragments" }
eframe.workspace = true
egui.workspace = true
glow.workspace = true
anyhow.workspace = true
# Настройки чужого синхронизатора Notion — из них берутся токен
# и страница карточек по умолчанию (app/integrations.rs).
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.15"
# Буфер обмена для копирования реплик субтитров.
arboard = "3"
# Разбор .ico в пиксели: eframe принимает иконку окна только так.
# JPEG — мозаика миниатюр и кадры предпросмотра приходят в нём.
image = { version = "0.25", default-features = false, features = ["ico", "jpeg"] }
# Файловые ассоциации в HKCU: делаются по явному действию пользователя.
winreg = "0.52"

# Цвет заголовка окна задаётся только через DWM: ни winit, ни eframe его
# не выставляют, а системный отливает цветом обоев (см. caption.rs).
# Оба крейта уже в дереве зависимостей — их тянет сам eframe.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Рабочая область экрана: по ней открывается окно, закрытое развёрнутым
    # (screen.rs).
    "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"
