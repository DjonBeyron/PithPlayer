[workspace]
resolver = "3"
members = [
    "crates/pith-mpv",
    "crates/pith-store",
    "crates/pith-subs",
    "crates/pith-fragments",
    "crates/pith-app",
]

[workspace.package]
version = "5.0.0"
edition = "2024"
license = "Proprietary"
authors = ["Pith"]

[workspace.dependencies]
libmpv2 = "6.0"
eframe = { version = "0.35", default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = "0.35"
glow = "0.16"
anyhow = "1"
thiserror = "2"
serde = "1"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Релизная сборка: оптимизация по скорости, один модуль трансляции.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Отладочная сборка: зависимости оптимизируем, свой код — нет.
# Без этого воспроизведение 4К в debug непригодно для проверки.
[profile.dev.package."*"]
opt-level = 2
